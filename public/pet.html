<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pet ID | PetVora PawTag</title>
<meta name="theme-color" content="#1668C7">
<link rel="icon" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
body{padding-bottom:96px}
.hero{text-align:center;padding:14px 0 6px;background:radial-gradient(120% 70% at 50% 0%,var(--bg2),transparent 70%)}
.idchip{display:inline-block;background:var(--card);color:var(--cardink);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:700;letter-spacing:.12em;font-size:.9rem;margin:10px 0 18px}
.photo{position:relative;width:min(300px,78vw);margin:0 auto 26px}
.arch{width:100%;aspect-ratio:4/5;border-radius:999px 999px 36px 36px;overflow:hidden;border:9px solid var(--primary);background:var(--bg2);box-shadow:0 26px 50px -24px var(--pdark)}
.arch img{width:100%;height:100%;object-fit:cover}
.sticker{position:absolute;right:-26px;bottom:-22px;width:132px;height:132px;border-radius:50%;border:7px solid #fff;box-shadow:0 10px 22px rgba(0,0,0,.35);transform:rotate(10deg);object-fit:cover;background:#fff}
.sticker-paw{position:absolute;left:-18px;top:34px;width:58px;height:58px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;padding:13px;box-shadow:0 8px 18px rgba(0,0,0,.3);transform:rotate(-14deg)}
.name{font-family:var(--display);font-weight:900;font-size:clamp(3.6rem,19vw,7rem);line-height:.95;color:var(--pdark);letter-spacing:-.01em;word-break:break-word;padding:0 8px}
[data-dark="1"] .name{color:var(--accent)}
.sub{margin-top:12px;font-size:1.1rem;color:var(--soft);font-weight:500}
.sub b{color:var(--ink)}
.actions{display:grid;gap:16px;margin:30px 0 0}
.act{position:relative;display:flex;align-items:center;gap:16px;text-decoration:none;border-radius:24px;padding:18px 20px;color:#fff;text-align:left;box-shadow:0 16px 30px -14px rgba(0,0,0,.5)}
.act .ic{flex:none;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:1.7rem}
.act strong{display:block;font-size:1.35rem;line-height:1.15}
.act span{font-size:.95rem;opacity:.95}
.act .tap{margin-left:auto;font-size:1.9rem;animation:hand 1.3s ease-in-out infinite}
.call{background:linear-gradient(135deg,#16a34a,#0f7a37)}
.loc{background:linear-gradient(135deg,var(--primary),var(--pdark))}
.act::after{content:"";position:absolute;inset:0;border-radius:24px;animation:ring 2s infinite;pointer-events:none}
.call::after{--c:22,163,74}.loc::after{--c:255,255,255}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(var(--c),.55)}70%,100%{box-shadow:0 0 0 18px rgba(var(--c),0)}}
@keyframes hand{50%{transform:translateY(-7px)}}
.agebox{text-align:center;padding:30px 22px;background:linear-gradient(160deg,var(--primary),var(--pdark));color:#fff;border:0}
.agebox .big{font-family:var(--display);font-weight:900;font-size:clamp(2.3rem,10vw,3.5rem);line-height:1.05;margin:8px 0}
.agebox small{opacity:.9;font-size:.98rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fact{background:var(--card);color:var(--cardink);border:1px solid var(--line);border-radius:22px;padding:16px 18px}
.fact small{display:block;color:var(--soft);font-size:.85rem}
[data-dark="1"] .fact small{color:#c9b095}
.fact b{font-family:var(--display);font-size:1.3rem;line-height:1.2;display:block;margin-top:2px;word-break:break-word}
.fact.wide{grid-column:1/-1}
.vac{width:100%;border-radius:18px;margin-top:12px;border:1px solid var(--line);cursor:zoom-in}
.found{background:var(--card);color:var(--cardink);border:3px dashed var(--primary);border-radius:30px;padding:28px 22px;text-align:center}
.found h2{color:var(--pdark)}
[data-dark="1"] .found h2{color:var(--accent)}
.about{display:flex;gap:18px;align-items:center}
.about img{flex:none;width:112px;height:112px;border-radius:50%;border:6px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.3);transform:rotate(-8deg);object-fit:cover}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -10px 28px rgba(0,0,0,.18)}
.bar a{flex:1;text-align:center;text-decoration:none;color:#fff;font-weight:700;padding:14px 8px;border-radius:16px;font-size:1.02rem}
.bar .c{background:linear-gradient(135deg,#16a34a,#0f7a37)}.bar .l{background:linear-gradient(135deg,var(--primary),var(--pdark))}
.state{min-height:70vh;display:grid;place-items:center;text-align:center;padding:30px}
.state .paw{width:84px;margin:0 auto 14px;color:var(--primary);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.6}}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:none;place-items:center;padding:16px}
.lb.on{display:grid}.lb img{max-height:92vh;border-radius:12px}
@media(max-width:380px){.about{flex-direction:column;text-align:center}.sticker{width:108px;height:108px;right:-14px}}
</style>
</head>
<body>
<div class="paws" id="paws" aria-hidden="true"></div>
<header class="top"><img src="/img/petvora_logo.png" alt="PetVora"><div><b>PetVora</b><small>Smarter Technology for Happier Pets</small></div></header>
<main id="app"><div class="state"><div><div class="paw" id="pawload"></div><p class="lead">Fetching my ID...</p></div></div></main>
<div class="lb" id="lb"><img id="lbimg" alt=""></div>
<script src="/js/common.js"></script>
<script>
(function () {
  var app = document.getElementById("app");
  document.getElementById("pawload").innerHTML = PV.PAW;
  var seg = location.pathname.split("/").filter(Boolean);
  var id = (seg[0] === "p" && seg[1] ? seg[1] : new URLSearchParams(location.search).get("id") || "").toUpperCase();
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function load() {
    for (var i = 0; i < 5; i++) {
      try {
        var res = await fetch("/api/pet?id=" + encodeURIComponent(id), { cache: "no-store" });
        if (res.status === 404) return { missing: true };
        if (res.ok) { var d = await res.json(); try { localStorage.setItem("pv_" + id, JSON.stringify(d)); } catch (e) {} return { data: d }; }
      } catch (e) {}
      await wait(700 * (i + 1));
    }
    try { var c = JSON.parse(localStorage.getItem("pv_" + id)); if (c) return { data: c }; } catch (e) {}
    return { failed: true };
  }

  function nextBirthday(dob) {
    var p = dob.split("-").map(Number), n = new Date(), t = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    var b = new Date(n.getFullYear(), p[1] - 1, p[2]);
    if (b < t) b = new Date(n.getFullYear() + 1, p[1] - 1, p[2]);
    return Math.round((b - t) / 864e5);
  }

  function render(r) {
    var t = PV.applyTheme(r.breed);
    var breedName = r.breed === "other" ? (r.breedName || "Lovely pet") : t.name;
    document.title = r.name + " | Pet ID | PetVora";
    PV.mountPaws(document.getElementById("paws"), r.id, 18);
    var a = PV.ageFrom(r.dob), tel = PV.telLink(r.phone), map = PV.mapLink(r);
    var stickerImg = t.img;
    var mainImg = r.photo || stickerImg;
    var hasStickerOverlay = !!r.photo && r.breed !== "other";
    var bd = nextBirthday(r.dob);
    var h = "";
    h += '<section class="hero"><div class="wrap">';
    h += '<span class="idchip">ID ' + esc(r.id) + '</span>';
    h += '<div class="photo"><div class="arch"><img src="' + esc(mainImg) + '" alt="' + esc(r.name) + '"></div>';
    if (hasStickerOverlay) h += '<img class="sticker" src="' + esc(stickerImg) + '" alt="' + esc(breedName) + ' sticker">';
    h += '<div class="sticker-paw">' + PV.PAW + '</div></div>';
    h += '<h1 class="name">' + esc(r.name) + '</h1>';
    h += '<p class="sub"><b>' + esc(breedName) + '</b> &middot; ' + esc(PV.ageText(a)) + ' old</p>';
    h += '<div class="actions">';
    h += '<a class="act call" href="tel:' + esc(tel) + '"><span class="ic">&#128222;</span><div><strong>Call my owner</strong><span>Tap here to call now</span></div><span class="tap">&#128073;</span></a>';
    if (map) h += '<a class="act loc" href="' + esc(map) + '" target="_blank" rel="noopener"><span class="ic">&#128205;</span><div><strong>See where I live</strong><span>Tap here to open the map</span></div><span class="tap">&#128073;</span></a>';
    h += '</div></div></section>';

    h += '<div class="wrap">';
    h += '<section class="sec"><div class="card agebox"><small>My age (it grows every day)</small><div class="big">' + esc(PV.ageText(a)) + '</div><small>' + (a.y || a.m ? 'and ' + a.d + (a.d === 1 ? ' day' : ' days') + ' &middot; ' : '') + (bd === 0 ? 'Today is my birthday!' : 'next birthday in ' + bd + (bd === 1 ? ' day' : ' days')) + '</small></div></section>';

    h += '<section class="sec"><h2>About ' + esc(r.name) + '</h2><p class="lead" style="margin-bottom:16px">Everything you need to know about me.</p><div class="grid">';
    h += '<div class="fact"><small>Breed</small><b>' + esc(breedName) + '</b></div>';
    if (r.gender) h += '<div class="fact"><small>Gender</small><b>' + esc(r.gender) + '</b></div>';
    if (r.color) h += '<div class="fact"><small>Colour</small><b>' + esc(r.color) + '</b></div>';
    h += '<div class="fact"><small>Pet ID</small><b>' + esc(r.id) + '</b></div>';
    if (r.notes) h += '<div class="fact wide"><small>Good to know</small><b style="font-family:var(--body);font-weight:500;font-size:1.05rem">' + esc(r.notes) + '</b></div>';
    h += '</div></section>';

    h += '<section class="sec"><h2>My family</h2><p class="lead" style="margin-bottom:16px">Please contact them if you found me.</p><div class="grid">';
    if (r.ownerName) h += '<div class="fact wide"><small>Owner</small><b>' + esc(r.ownerName) + '</b></div>';
    if (r.address) h += '<div class="fact wide"><small>Home area</small><b style="font-size:1.1rem">' + esc(r.address) + '</b></div>';
    h += '</div></section>';

    if (r.vaccine) h += '<section class="sec"><h2>Vaccination record</h2><p class="lead">Tap the picture to see it bigger.</p><img class="vac" id="vac" src="' + esc(r.vaccine) + '" alt="Vaccination record"></section>';

    h += '<section class="sec"><div class="found"><h2>Did you find me?</h2><p class="lead" style="margin-bottom:18px">Thank you for being kind. Please stay with me and call my family now.</p><a class="btn btn-main" style="width:100%" href="tel:' + esc(tel) + '">&#128222; Call ' + esc(r.ownerName || "my owner") + '</a>';
    if (map) h += '<a class="btn btn-line" style="width:100%;margin-top:12px" href="' + esc(map) + '" target="_blank" rel="noopener">&#128205; Open map location</a>';
    h += '</div></section>';

    h += '<section class="sec"><div class="card about"><img src="' + esc(stickerImg) + '" alt=""><div><h2 style="font-size:1.5rem">' + (breedName ? 'I am a ' + esc(breedName) : 'About me') + '</h2><p style="font-size:.98rem">' + esc(t.about) + '</p></div></div></section>';
    h += '</div>';
    h += '<footer><img src="/img/petvora_logo.png" alt="PetVora"><b style="font-family:var(--display);font-size:1.3rem;color:var(--ink)">PetVora PawTag</b><p>Smarter Technology for Happier Pets</p></footer>';
    h += '<div class="bar"><a class="c" href="tel:' + esc(tel) + '">&#128222; Call owner</a>' + (map ? '<a class="l" href="' + esc(map) + '" target="_blank" rel="noopener">&#128205; Location</a>' : '') + '</div>';
    app.innerHTML = h;
    var v = document.getElementById("vac");
    if (v) v.onclick = function () { document.getElementById("lbimg").src = v.src; document.getElementById("lb").classList.add("on"); };
    document.getElementById("lb").onclick = function () { this.classList.remove("on"); };
  }

  function msg(title, text, retry) {
    app.innerHTML = '<div class="state"><div><div class="paw">' + PV.PAW + '</div><h2>' + title + '</h2><p class="lead" style="margin:8px 0 18px">' + text + '</p>' + (retry ? '<button class="btn btn-main" id="retry">Try again</button>' : '') + '</div></div>';
    var b = document.getElementById("retry"); if (b) b.onclick = start;
  }
  async function start() {
    app.innerHTML = '<div class="state"><div><div class="paw">' + PV.PAW + '</div><p class="lead">Fetching my ID...</p></div></div>';
    var r = await load();
    if (r.data) render(r.data);
    else if (r.missing) msg("This ID was not found", "Please check the QR code or the ID and try again.", false);
    else msg("Slow internet", "We could not load the ID yet. Please check your internet and try again.", true);
  }
  if (!id) msg("No ID given", "Please scan a PetVora QR code.", false); else start();
})();
</script>
</body>
</html>
